org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official

# Set to false (or pass -Pslim=true) to build WITHOUT the FFmpeg bundle.
# Slim build cannot merge 1080p video+audio and cannot encode mp3, but is ~35 MB smaller.
slim=false
