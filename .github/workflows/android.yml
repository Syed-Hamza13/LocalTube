name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', '**.gitignore' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }} apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # `full` bundles FFmpeg (merging + mp3), `slim` does not and is ~35 MB smaller.
        include:
          - variant: full
            slim: false
          - variant: slim
            slim: true
    env:
      TERM: dumb
      # A step-level `if` cannot read the `secrets` context, so the presence of the keystore is
      # mirrored into a job env var and tested through that.
      KEYSTORE_BASE64: ${{ secrets.LOCALTUBE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provides `gradle` on PATH; the repo carries no binary gradle-wrapper.jar on purpose.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.8'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Decode release keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          LOCALTUBE_KEYSTORE_BASE64: ${{ secrets.LOCALTUBE_KEYSTORE_BASE64 }}
        run: |
          echo "LOCALTUBE_KEYSTORE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          printf '%s' "$LOCALTUBE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Assemble debug
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: gradle --no-daemon assembleDebug -Pslim=${{ matrix.slim }}

      - name: Assemble release
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        env:
          LOCALTUBE_KEY_ALIAS: ${{ secrets.LOCALTUBE_KEY_ALIAS }}
          LOCALTUBE_KEY_PASSWORD: ${{ secrets.LOCALTUBE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -Pslim=${{ matrix.slim }}

      - name: Report APK sizes
        run: |
          {
            echo "## ${{ matrix.variant }} build"
            echo '```'
            find app/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n' | sort | \
              awk '{ printf "%-58s %8.2f MB\n", $1, $2/1048576 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-${{ matrix.variant }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
